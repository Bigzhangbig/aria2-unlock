name: Multi-Platform Release Build (Unlock)

on:
  push:
    branches: [ master, feat-automation-scripts ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }} (Static)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Build Tools & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config gettext autopoint intltool libcppunit-dev
        if [[ "${{ matrix.arch }}" == "arm64" ]]; then
          sudo dpkg --add-architecture arm64
          sudo install -d /etc/apt/sources.list.d
          # Replace runner's amd64-only sources with one that explicitly serves both archs
          # (the default sources include security.ubuntu.com which 404s for arm64 and breaks apt-get update).
          printf 'Types: deb\nURIs: http://azure.archive.ubuntu.com/ubuntu\nSuites: noble noble-updates noble-backports\nComponents: main restricted universe multiverse\nArchitectures: amd64 arm64\n' | sudo tee /etc/apt/sources.list.d/aria2-cross.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libssl-dev:arm64
        fi

    - name: Prepare build
      run: |
        autoreconf -i

    - name: Configure and Build
      run: |
        if [[ "${{ matrix.arch }}" == "x64" ]]; then
          ./configure --enable-static --disable-nls --without-libxml2 --without-gnutls --without-libssh2 --without-sqlite3
        else
          ./configure --host=aarch64-linux-gnu --enable-static --disable-nls --without-libxml2 --without-gnutls --without-libssh2 --without-sqlite3
        fi
        make -j$(nproc)
    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: aria2c-linux-${{ matrix.arch }}-unlock
        path: src/aria2c

  build-windows:
    name: Build Windows x64 (MinGW)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Windows setup
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 libz-mingw-w64-dev autoconf automake libtool pkg-config gettext autopoint intltool
    - name: Prepare build
      run: |
        autoreconf -i
    - name: Build aria2c
      run: |
        ./configure --host=x86_64-w64-mingw32 --without-libxml2 --without-gnutls --without-libnettle --without-libgmp --without-libssh2 --without-sqlite3 --without-libexpat --disable-nls
        make -j$(nproc)
    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: aria2c-windows-x64-unlock
        path: src/aria2c.exe

  build-macos:
    name: Build macOS with LLVM 21
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM 21
      run: |
        brew install llvm@21
        echo "CC=$(brew --prefix llvm@21)/bin/clang" >> $GITHUB_ENV
        echo "CXX=$(brew --prefix llvm@21)/bin/clang++" >> $GITHUB_ENV
    - name: Build aria2c
      run: |
        brew install autoconf automake libtool pkg-config gettext libxml2 sqlite3 c-ares libssh2
        autoreconf -i
        ./configure --without-openssl --without-gnutls --with-appletls --with-libxml2 --disable-nls
        make -j$(sysctl -n hw.ncpu)
    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: aria2c-macos-unlock
        path: src/aria2c
